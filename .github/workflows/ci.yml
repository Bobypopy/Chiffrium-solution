name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + JAR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL réel pour les tests des dépôts (mode serveur d'équipe).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/ci
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
      # Le jar ne sert qu'au job "interface" de ce même run : inutile de le garder (quota de stockage du compte).
      - uses: actions/upload-artifact@v6
        with:
          name: chiffrium-backend-jar
          path: backend/target/chiffrium-backend.jar
          retention-days: 1

  frontend:
    name: Frontend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm test

  desktop:
    name: Application de bureau (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test

  interface:
    name: Interface (navigateur)
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 20
    # Les tests unitaires du front ne voient pas le navigateur : ici, l'application est réellement démarrée,
    # une analyse est jouée, et les écrans sont parcourus. La campagne complète tourne la nuit
    # (nightly.yml) ; on ne garde ici que ce qui doit rester vert à chaque poussée.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v7
        with:
          name: chiffrium-backend-jar
          path: backend/target
      - name: Outils de test
        run: |
          python -m pip install --quiet requests playwright
          python -m playwright install --with-deps chromium
      - name: Projets de test
        run: python qa/projets.py
      # Sans cdxgen : l'analyse reste rapide et l'interface est ce que l'on teste ici.
      - name: Démarrer l'application
        run: |
          mkdir -p qa/travail/qa-data
          DATA_DIR=qa/travail/qa-data PORT=18110 BIND_ADDRESS=127.0.0.1 STATIC_DIR=frontend/public \
            ALLOWED_LOCAL_ROOTS=qa/travail/projets OSV_ENABLED=false \
            nohup java -jar backend/target/chiffrium-backend.jar > qa/travail/backend.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:18110/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18110/api/health
      - name: Parcours des écrans
        working-directory: qa
        run: |
          python suite_auth.py
          python test_rapport_ui.py
          python test_langue.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rapports-interface
          path: |
            qa/travail/qa-rapport-*.json
            qa/travail/backend.log
          if-no-files-found: warn
          retention-days: 7

  kubernetes:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rendu Kustomize et validation des schémas
        run: |
          kubectl kustomize deploy/k8s/overlays/local > rendered.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:latest -strict -summary /work/rendered.yaml

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      # L'image de base cdxgen fait ~4 Go une fois décompressée : on libère le disque du runner.
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v4
      - name: Image frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          tags: chiffrium-frontend:ci
          push: false
      - name: Image backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: chiffrium-backend:ci
          build-args: SKIP_TESTS=true
          push: false
