name: Release

# Publier une version : git tag v2.4.0 && git push origin v2.4.0
# Construit l'installateur Windows et les paquets Linux, puis les publie dans une release GitHub où les
# applications installées vont chercher leurs mises à jour.
#
# Si la variable RELEASES_REPO (ex. Bobypopy/Chiffrium-releases) et le secret RELEASES_TOKEN sont définis, les
# releases partent dans ce dépôt public. Sinon, elles restent dans ce dépôt (qui doit alors être public pour
# que les mises à jour automatiques fonctionnent). La signature SignPath demande que ce workflow tourne dans le
# dépôt public du code (voir CONTRIBUTING.md, section Releases).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  backend:
    name: Backend (tests + JAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Version unique : le numéro du tag (v2.4.0 -> 2.4.0) s'applique au backend et à l'application de bureau.
      - run: mvn -B -f backend/pom.xml verify -Drevision="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v6
        with:
          name: backend-jar
          path: backend/target/chiffrium-backend.jar
          retention-days: 1

  desktop:
    name: Installateur ${{ matrix.os }}
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: backend-jar
          path: backend/target
      # JDK de la plateforme cible : jlink produit un JRE propre à chaque système.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Dépendances et ressources embarquées
        working-directory: desktop
        env:
          APP_VERSION: ${{ github.ref_name }}
          # Test de bout en bout avec le vrai moteur (réinitialisation du mot de passe administrateur).
          CHIFFRIUM_JAR: ${{ github.workspace }}/backend/target/chiffrium-backend.jar
        run: |
          npm ci
          npm test
          node scripts/prepare.mjs
      - name: Construction et publication
        working-directory: desktop
        shell: bash
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature Windows (voir CONTRIBUTING.md, section Releases) : par SignPath si la variable SIGNPATH_ORGANIZATION_ID
          # est définie, sinon par le certificat des secrets WINDOWS_CSC_*, s'ils existent.
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASES_REPO" ]; then
            if [ -z "$RELEASES_TOKEN" ]; then
              echo "::error::RELEASES_REPO est défini mais le secret RELEASES_TOKEN manque (voir CONTRIBUTING.md, section Releases)."
              exit 1
            fi
            export UPDATE_OWNER="${RELEASES_REPO%%/*}" UPDATE_REPO="${RELEASES_REPO#*/}" GH_TOKEN="$RELEASES_TOKEN"
            echo "Publication dans $RELEASES_REPO"
          else
            export GH_TOKEN="$REPO_TOKEN"
          fi
          # Avec SignPath, l'installateur Windows est publié après sa signature (étapes suivantes).
          publication=always
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            publication=never
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npx electron-builder --config electron-builder.config.cjs --publish "$publication" \
            -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      - name: Installateur à signer
        id: non-signe
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v6
        with:
          name: installateur-non-signe
          path: desktop/dist/Chiffrium-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Signature SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Chiffrium' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'installateur' }}
          github-artifact-id: ${{ steps.non-signe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/signe
      # La signature change le fichier : empreinte de latest.yml et blockmap recalculées avant publication.
      - name: Publication de l'installateur signé
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        working-directory: desktop
        shell: bash
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          installateur="Chiffrium-Setup-$version.exe"
          node scripts/after-sign.mjs "signe/$installateur" dist
          export GH_TOKEN="${RELEASES_TOKEN:-$REPO_TOKEN}"
          depot="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          # La release peut déjà exister (créée par le job Linux) : on ne la crée que si elle manque.
          gh release view "$GITHUB_REF_NAME" --repo "$depot" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$depot" --title "$version" --notes "" \
            || gh release view "$GITHUB_REF_NAME" --repo "$depot" > /dev/null
          gh release upload "$GITHUB_REF_NAME" "dist/$installateur" "dist/$installateur.blockmap" dist/latest.yml \
            --repo "$depot" --clobber

      # Le moteur seul, téléchargé par l'action GitHub (docs/releases-repo/action) et la ligne de commande.
      - name: Moteur en ligne de commande
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GH_TOKEN="${RELEASES_TOKEN:-$REPO_TOKEN}" gh release upload "$GITHUB_REF_NAME" \
            backend/target/chiffrium-backend.jar --repo "${RELEASES_REPO:-$GITHUB_REPOSITORY}" --clobber

      # Les pages de release sont les seules pages publiques du produit, donc les premières indexées : on y
      # écrit ce que fait l'outil et ce que contient la version, au lieu de les laisser vides.
      - name: Notes de version
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          depot="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          jeton="${RELEASES_TOKEN:-$REPO_TOKEN}"
          python .github/scripts/notes-de-version.py "${GITHUB_REF_NAME#v}" "$depot" "$jeton"
