name: Release

# Publier une version : git tag v1.3.0 && git push origin v1.3.0
# Construit l'installateur Windows, les paquets Linux et le moteur seul, puis les publie dans une release de ce
# dépôt, où les applications installées vont chercher leurs mises à jour. Seul un dépôt public publie : une
# release privée ne servirait pas les mises à jour, et SignPath ne signe que ce que construit le dépôt public.
#
# Ancien dépôt des versions : tant que la variable MIRROR_REPO (ex. Bobypopy/Chiffrium-releases) et le secret
# MIRROR_TOKEN sont définis, chaque version y est aussi recopiée, pour les installations qui y cherchent encore
# leurs mises à jour.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  backend:
    name: Backend (tests + JAR)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Version unique : le numéro du tag (v1.3.0 -> 1.3.0) s'applique au backend et à l'application de bureau.
      - run: mvn -B -f backend/pom.xml verify -Drevision="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v6
        with:
          name: backend-jar
          path: backend/target/chiffrium-backend.jar
          retention-days: 1

  desktop:
    name: Installateur ${{ matrix.os }}
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: backend-jar
          path: backend/target
      # JDK de la plateforme cible : jlink produit un JRE propre à chaque système.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Dépendances et ressources embarquées
        working-directory: desktop
        env:
          APP_VERSION: ${{ github.ref_name }}
          # Test de bout en bout avec le vrai moteur (réinitialisation du mot de passe administrateur).
          CHIFFRIUM_JAR: ${{ github.workspace }}/backend/target/chiffrium-backend.jar
        run: |
          npm ci
          npm test
          node scripts/prepare.mjs
      - name: Construction et publication
        working-directory: desktop
        shell: bash
        env:
          # Signature Windows : par SignPath si la variable SIGNPATH_ORGANIZATION_ID est définie, sinon par le
          # certificat des secrets WINDOWS_CSC_*, s'ils existent.
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          # Avec SignPath, l'installateur Windows est publié après sa signature (étapes suivantes).
          publication=always
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            publication=never
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npx electron-builder --config electron-builder.config.cjs --publish "$publication" \
            -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      - name: Installateur à signer
        id: non-signe
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v6
        with:
          name: installateur-non-signe
          path: desktop/dist/Chiffrium-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Signature SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Chiffrium' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'installateur' }}
          github-artifact-id: ${{ steps.non-signe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/signe
      # La signature change le fichier : empreinte de latest.yml et blockmap recalculées avant publication.
      - name: Publication de l'installateur signé
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        working-directory: desktop
        shell: bash
        run: |
          installateur="Chiffrium-Setup-${GITHUB_REF_NAME#v}.exe"
          node scripts/after-sign.mjs "signe/$installateur" dist
          bash ../.github/scripts/publier.sh "$GITHUB_REPOSITORY" "dist/$installateur" "dist/$installateur.blockmap" \
            dist/latest.yml

      # Le moteur seul, téléchargé par l'action GitHub (action/) et la ligne de commande.
      - name: Moteur en ligne de commande
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/publier.sh "$GITHUB_REPOSITORY" backend/target/chiffrium-backend.jar

      - name: Copie vers l'ancien dépôt des versions
        if: vars.MIRROR_REPO != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
        run: |
          shopt -s nullglob
          fichiers=(desktop/dist/*.exe desktop/dist/*.exe.blockmap desktop/dist/*.AppImage desktop/dist/*.deb \
            desktop/dist/latest*.yml)
          if [ "$RUNNER_OS" = "Linux" ]; then fichiers+=(backend/target/chiffrium-backend.jar); fi
          bash .github/scripts/publier.sh "$MIRROR_REPO" "${fichiers[@]}"

      # Les pages de release sont les premières indexées par les moteurs de recherche : on y écrit ce que fait
      # l'outil et ce que contient la version, au lieu de les laisser vides.
      - name: Notes de version
        if: runner.os == 'Linux'
        shell: bash
        run: python .github/scripts/notes-de-version.py "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GH_TOKEN"
