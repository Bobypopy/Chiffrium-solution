name: Wrong or missed detection
description: A false positive, or cryptography that Chiffrium did not find.
labels: [detection]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [False positive, Missed detection, Wrong status or recommendation]
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: A minimal snippet that reproduces it, with fake keys and secrets only.
      render: text
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language or file type
      placeholder: "Java, Terraform, PowerShell..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
