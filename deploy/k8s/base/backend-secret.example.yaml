# MODÈLE uniquement : ne jamais commiter de vrai jeton. Créer le secret hors dépôt :
#   kubectl -n chiffrium create secret generic backend-secrets \
#     --from-literal=MASTER_KEY="$(openssl rand -base64 32)" --from-literal=GIT_TOKEN=xxxx
# MASTER_KEY chiffre la base locale et les rapports : la sauvegarder séparément (sa perte rend les données
# illisibles), ne jamais la changer sans migration.
# (ou via Sealed Secrets / External Secrets / Vault selon l'infrastructure).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  MASTER_KEY: ""
  GIT_TOKEN: ""
