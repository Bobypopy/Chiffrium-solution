# Entrée HTTP et cloisonnement réseau : seul le frontend peut joindre le backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chiffrium
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  rules:
    - host: chiffrium.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress-from-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - port: 8080
