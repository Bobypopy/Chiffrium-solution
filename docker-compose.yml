# Environnement local complet : docker compose up --build  puis  http://localhost:8080
# Le backend et le frontend sont deux conteneurs indépendants (déployables et dimensionnables séparément).
name: chiffrium

services:
  backend:
    build:
      context: ./backend
      args:
        CDXGEN_VERSION: ${CDXGEN_VERSION:-12.9.0}
    image: chiffrium-backend:${TAG:-local}
    environment:
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-2}
      # Dossiers locaux analysables : monter un dossier dans /workspace pour l'activer.
      ALLOWED_LOCAL_ROOTS: /workspace
      # Jeton pour les dépôts privés (ne jamais le commiter) : GIT_TOKEN=xxx docker compose up
      GIT_TOKEN: ${GIT_TOKEN:-}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-}
      OSV_ENABLED: ${OSV_ENABLED:-true}
      # Derrière le frontend nginx : adresse d'origine lue dans X-Forwarded-For (journal d'audit).
      TRUST_PROXY: "true"
      # Clé maîtresse (Base64, 32 octets) ; vide = générée dans le volume /data/secrets au premier démarrage.
      MASTER_KEY: ${MASTER_KEY:-}
      # Profil "team" : PostgreSQL (vide = base H2 chiffrée embarquée).
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_USER: ${DATABASE_USER:-chiffrium}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-}
      AUDIT_EXPORT_DIR: ${AUDIT_EXPORT_DIR:-}
      # Plusieurs répliques : ARTIFACT_STORE=s3 (profil "minio") ou shared-dir, avec PostgreSQL.
      ARTIFACT_STORE: ${ARTIFACT_STORE:-local}
      # Dossier partagé entre instances (NFS, SMB, volume RWX) quand ARTIFACT_STORE=shared-dir.
      SHARED_ARTIFACTS_DIR: ${SHARED_ARTIFACTS_DIR:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-chiffrium}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-chiffrium}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - analyses-data:/data
      - ${WORKSPACE_DIR:-./workspace}:/workspace:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: chiffrium-frontend:${TAG:-local}
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Serveur d'équipe : docker compose --profile team up -d  (avec DATABASE_URL=jdbc:postgresql://postgres:5432/chiffrium)
  postgres:
    image: postgres:17-alpine
    profiles: [team]
    environment:
      POSTGRES_DB: chiffrium
      POSTGRES_USER: ${DATABASE_USER:-chiffrium}
      # Obligatoire : l image refuse de démarrer sans mot de passe.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Stockage objet gratuit pour plusieurs répliques : docker compose --profile team --profile minio up -d
  minio:
    # Registre quay.io : l'image du Docker Hub demande une authentification depuis 2026.
    image: quay.io/minio/minio:latest
    profiles: [minio]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-chiffrium}
      # Obligatoire (8 caractères minimum).
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  analyses-data:
  postgres-data:
  minio-data:
