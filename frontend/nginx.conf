# Sert l'interface statique et relaie /api vers le backend (même origine : pas de CORS nécessaire).
# L'adresse du backend vient de la variable BACKEND_URL (substituée au démarrage par l'image nginx).
server {
    listen 8080;
    # "localhost" résout vers ::1 dans l'image : sans cette ligne, le HEALTHCHECK échoue toujours.
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx est en frontal : on écrase la valeur (un client ne doit pas pouvoir falsifier son adresse d audit).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Modules ES sans empreinte dans le nom : revalidation (ETag) à chaque chargement, sinon un navigateur
    # garderait l'ancienne interface face à une nouvelle API après une mise à jour du serveur.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:png|svg|ico)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Page d'entrée toujours revalidée ; add_header dans un bloc annule les en-têtes hérités : on les répète.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    }
}
